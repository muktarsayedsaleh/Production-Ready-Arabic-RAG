# Every document the eval indexes. Format: evals/dataset.py.
#
# Wikipedia documents are pinned to a revision; `uv run python -m evals.wikipedia` fetches
# them again from these permalinks. version_date is the revision date (UTC).
#
# Internal documents are fictional and written for this repo (CC0, see internal/LICENSE).
# Their ACLs drive the personal and leakage cases; a document without an ACL is public.

